<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer Contraseña — SyncOps Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page-exact">

  <div class="login-bg-split">
    <div class="split-white-side"></div>
    <div class="split-blue-side"></div>
  </div>

  <div class="exact-login-container">
    <div class="exact-login-card">

      <div class="exact-brand-side">
        <div class="exact-brand-logo">
          <svg width="64" height="64" viewBox="0 0 80 80" fill="none">
            <rect width="80" height="80" rx="18" fill="#EFF6FF" />
            <path d="M40 18C34 26 31 35 34 45C36 38 41 33 46 29C44 42 35 52 40 62C45 54 48 45 45 35C43 42 38 47 33 51C35 38 44 28 40 18Z" fill="url(#logoBlueGrad)" />
            <defs>
              <linearGradient id="logoBlueGrad" x1="20%" y1="0%" x2="80%" y2="100%">
                <stop offset="0%" stop-color="#2563EB" />
                <stop offset="100%" stop-color="#1D4ED8" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <h1 class="exact-brand-title">SYNCOPS DASHBOARD</h1>
        <p class="exact-brand-sub">Suite de Gestión para Lavanderías &amp; Sastrería</p>

        <div class="exact-brand-divider"></div>

        <p class="exact-no-account-text">¿Ya recordaste tu contraseña?</p>

        <button type="button" class="exact-btn-create-account" onclick="window.location.href='login.html'">
          <span>Volver a Iniciar Sesión</span>
        </button>
      </div>

      <div class="exact-form-side">
        <h2 class="exact-form-title" id="resetHeaderTitle">Restablecer Contraseña</h2>
        <p class="exact-form-sub" id="resetHeaderSub">Elige una nueva contraseña para tu cuenta</p>

        <form id="resetPasswordForm" onsubmit="handleResetPasswordSubmit(event)">

          <div class="exact-field-group">
            <label class="exact-field-label">Nueva Contraseña</label>
            <div class="password-input-container">
              <input type="password" id="resetNewPassword" class="exact-field-input" required minlength="8" placeholder="Mínimo 8 caracteres" style="padding-right: 42px;" />
              <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('resetNewPassword')" title="Mostrar / Ocultar contraseña">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="exact-field-group">
            <label class="exact-field-label">Confirmar Nueva Contraseña</label>
            <input type="password" id="resetConfirmPassword" class="exact-field-input" required minlength="8" placeholder="Repite la contraseña" />
          </div>

          <button type="submit" class="exact-btn-simple" id="resetSubmitBtn">
            <span>Guardar Nueva Contraseña</span>
          </button>

        </form>
      </div>

    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    const parametros = new URLSearchParams(window.location.search);
    const resetEmail = parametros.get('email');
    const resetToken = parametros.get('token');

    document.addEventListener('DOMContentLoaded', () => {
      if (!resetEmail || !resetToken) {
        document.getElementById('resetHeaderTitle').innerText = 'Enlace inválido';
        document.getElementById('resetHeaderSub').innerText = 'Este enlace de recuperación no es válido. Solicita uno nuevo desde la pantalla de inicio de sesión.';
        document.getElementById('resetPasswordForm').style.display = 'none';
      }
    });

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function handleResetPasswordSubmit(e) {
      e.preventDefault();
      const nueva = document.getElementById('resetNewPassword').value;
      const confirmar = document.getElementById('resetConfirmPassword').value;
      const btn = document.getElementById('resetSubmitBtn');

      if (nueva !== confirmar) {
        showToast('Las contraseñas no coinciden.', 'error');
        return;
      }

      btn.disabled = true;
      try {
        const resp = await api.resetPassword(resetEmail, resetToken, nueva);
        showToast(resp.message, 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 800);
      } catch (err) {
        showToast(err.message || 'No se pudo restablecer la contraseña.', 'error');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
