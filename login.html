<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Administrador — SyncOps Dashboard</title>
  
  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page-exact">

  <!-- Fondo Geométrico Split -->
  <div class="login-bg-split">
    <div class="split-white-side"></div>
    <div class="split-blue-side"></div>
  </div>

  <!-- Tarjeta Central -->
  <div class="exact-login-container">
    <div class="exact-login-card">
      
      <!-- ==============================================
           LADO IZQUIERDO: BRANDING SYNCOPS (BLANCO)
           ============================================== -->
      <div class="exact-brand-side">
        <!-- Logo Stylized Sync Flame -->
        <div class="exact-brand-logo">
          <svg width="64" height="64" viewBox="0 0 80 80" fill="none">
            <rect width="80" height="80" rx="18" fill="#EFF6FF" />
            <path d="M40 18C34 26 31 35 34 45C36 38 41 33 46 29C44 42 35 52 40 62C45 54 48 45 45 35C43 42 38 47 33 51C35 38 44 28 40 18Z" fill="url(#logoBlueGrad)" />
            <defs>
              <linearGradient id="logoBlueGrad" x1="20%" y1="0%" x2="80%" y2="100%">
                <stop offset="0%" stop-color="#2563EB" />
                <stop offset="100%" stop-color="#1D4ED8" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <h1 class="exact-brand-title">SYNCOPS DASHBOARD</h1>
        <p class="exact-brand-sub" id="brandSubText">Suite de Gestión para Lavanderías &amp; Sastrería</p>

        <div class="exact-brand-divider"></div>

        <p class="exact-no-account-text" id="toggleQuestionText">¿Ya tienes una cuenta de administrador?</p>
        
        <button type="button" class="exact-btn-create-account" onclick="toggleAuthMode()">
          <span id="btnCreateText">Iniciar Sesión</span>
        </button>
      </div>

      <!-- ==============================================
           LADO DERECHO: FORMULARIO REGISTRO / ACCESO
           ============================================== -->
      <div class="exact-form-side">
        <h2 class="exact-form-title" id="authHeaderTitle">Registro de Administrador</h2>
        <p class="exact-form-sub" id="authHeaderSub">Crea tu cuenta de administrador para iniciar el sistema limpio</p>

        <form id="exactLoginForm" onsubmit="handleAuthSubmit(event)">
          
          <!-- Campo: Nombre del Administrador -->
          <div class="exact-field-group" id="groupNameField">
            <label class="exact-field-label">Nombre Completo del Administrador</label>
            <input type="text" id="exactAuthName" class="exact-field-input" placeholder="Ej. Luis Bravo" required />
          </div>

          <!-- Campo: Nombre de la Tienda (Solo en registro) -->
          <div class="exact-field-group" id="groupStoreField">
            <label class="exact-field-label">Nombre de la Tienda / Negocio</label>
            <input type="text" id="exactStoreName" class="exact-field-input" placeholder="Ej. SyncOps Laundry & Suite" value="SyncOps Laundry &amp; Suite" />
          </div>

          <!-- Campo: Correo Electrónico -->
          <div class="exact-field-group">
            <label class="exact-field-label">Correo Electrónico</label>
            <input type="email" id="exactAuthEmail" class="exact-field-input" required placeholder="admin@syncopslaundry.do" />
          </div>

          <!-- Campo: Contraseña con Toggle Ojo -->
          <div class="exact-field-group">
            <label class="exact-field-label">Contraseña</label>
            <div class="password-input-container">
              <input type="password" id="exactAuthPassword" class="exact-field-input" required placeholder="Crea una contraseña segura" style="padding-right: 42px;" />
              <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility()" title="Mostrar / Ocultar contraseña">
                <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="exact-options-row">
            <label class="exact-checkbox-label">
              <input type="checkbox" id="exactRemember" checked />
              <span>Recordar sesión</span>
            </label>
          </div>

          <!-- Botón Simple y Limpio -->
          <button type="submit" class="exact-btn-simple" id="exactBtnSubmit">
            <span>Registrarme como Administrador &amp; Acceder</span>
          </button>

        </form>
      </div>

    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
  <script>
    // Comprobar si ya existe un administrador registrado previamente
    const savedAdmin = JSON.parse(localStorage.getItem('syncops_registered_admin') || 'null');
    let isRegisterMode = !savedAdmin; // Si no hay admin, inicia en Registro. Si ya hay, en Login.

    document.addEventListener('DOMContentLoaded', () => {
      updateFormView();
      if (savedAdmin) {
        document.getElementById('exactAuthEmail').value = savedAdmin.email || '';
      }
    });

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('exactAuthPassword');
      const eyeOpen = document.getElementById('eyeIconOpen');
      const eyeClosed = document.getElementById('eyeIconClosed');

      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        pwdInput.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      updateFormView();
    }

    function updateFormView() {
      const nameGroup = document.getElementById('groupNameField');
      const storeGroup = document.getElementById('groupStoreField');
      const headerTitle = document.getElementById('authHeaderTitle');
      const headerSub = document.getElementById('authHeaderSub');
      const submitBtnSpan = document.getElementById('exactBtnSubmit').querySelector('span');
      const toggleQ = document.getElementById('toggleQuestionText');
      const btnCreateText = document.getElementById('btnCreateText');

      if (isRegisterMode) {
        nameGroup.style.display = 'block';
        storeGroup.style.display = 'block';
        document.getElementById('exactAuthName').required = true;
        headerTitle.innerText = 'Registro de Administrador';
        headerSub.innerText = 'Crea tu cuenta de administrador para iniciar el sistema limpio';
        submitBtnSpan.innerText = 'Registrarme como Administrador & Acceder';
        toggleQ.innerText = '¿Ya tienes una cuenta de administrador?';
        btnCreateText.innerText = 'Iniciar Sesión';
      } else {
        nameGroup.style.display = 'none';
        storeGroup.style.display = 'none';
        document.getElementById('exactAuthName').required = false;
        headerTitle.innerText = 'Iniciar Sesión';
        headerSub.innerText = 'Ingresa con tus credenciales de administrador';
        submitBtnSpan.innerText = 'Iniciar Sesión';
        toggleQ.innerText = '¿Deseas configurar un nuevo administrador?';
        btnCreateText.innerText = 'Crear Administrador';
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('exactAuthEmail').value.trim();
      const password = document.getElementById('exactAuthPassword').value.trim();

      if (!email || !password) {
        showToast('Completa todos los campos obligatorios.', 'error');
        return;
      }

      if (isRegisterMode) {
        const name = document.getElementById('exactAuthName').value.trim();
        const store = document.getElementById('exactStoreName').value.trim() || 'SyncOps Laundry & Suite';

        if (!name) {
          showToast('Ingresa tu nombre completo de administrador.', 'error');
          return;
        }

        const adminUser = {
          name,
          email,
          role: 'Administrador General',
          store,
          avatar: name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase()
        };

        // Guardar cuenta de administrador registrada
        localStorage.setItem('syncops_registered_admin', JSON.stringify({ ...adminUser, password }));
        localStorage.setItem('syncops_user', JSON.stringify(adminUser));
        sessionStorage.setItem('syncops_user', JSON.stringify(adminUser));

        // Inicializar estado completamente limpio
        initializeCleanSystem(adminUser, store);

        showToast(`¡Administrador ${name} registrado con éxito!`, 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 350);

      } else {
        const registered = JSON.parse(localStorage.getItem('syncops_registered_admin') || 'null');
        
        if (registered && registered.email === email && registered.password === password) {
          const user = {
            name: registered.name,
            email: registered.email,
            role: registered.role || 'Administrador General',
            avatar: registered.avatar || 'AD'
          };
          localStorage.setItem('syncops_user', JSON.stringify(user));
          sessionStorage.setItem('syncops_user', JSON.stringify(user));
          showToast(`Bienvenido de nuevo, ${user.name}`, 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 300);
        } else {
          // Si no coincide o no existe, permitir inicio rápido con esas credenciales
          const user = {
            name: email.split('@')[0].replace('.', ' ').toUpperCase(),
            email,
            role: 'Administrador General',
            avatar: email.slice(0, 2).toUpperCase()
          };
          localStorage.setItem('syncops_user', JSON.stringify(user));
          sessionStorage.setItem('syncops_user', JSON.stringify(user));
          showToast(`Bienvenido, ${user.name}`, 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 300);
        }
      }
    }

    function initializeCleanSystem(admin, storeName) {
      const cleanState = {
        config: {
          businessName: storeName || 'SyncOps Laundry & Tailoring Suite',
          rnc: '131-89745-1',
          phone: '(809) 555-7962',
          address: 'Av. Winston Churchill #102, Santo Domingo',
          email: admin.email,
          printerWidth: '80mm',
          printerModel: 'epson-t20ii',
          invoicePrefix: 'FAC',
          nextInvoiceNumber: 1001,
          ticketFooter: 'Prendas no retiradas tras 30 días pasan a disposición legal. ¡Gracias por su preferencia!'
        },
        catalog: [
          // 1. Lavandería (Prendas por pieza con precios base editables)
          { id: '1', name: '👔 Camisa de Vestir / Manga Larga', category: 'Lavandería', service: 'Lavandería', price: 180 },
          { id: '2', name: '👖 Pantalón de Vestir / Gabardina', category: 'Lavandería', service: 'Lavandería', price: 200 },
          { id: '3', name: '🤵 Traje Completo (2 Piezas)', category: 'Lavandería', service: 'Lavandería', price: 450 },
          { id: '4', name: '👗 Vestido Casual / Fiesta', category: 'Lavandería', service: 'Lavandería', price: 350 },
          { id: '5', name: '🛏️ Edredón / Acolchado King Size', category: 'Lavandería', service: 'Lavandería', price: 600 },
          { id: '6', name: '🛌 Juego de Sábanas Completo', category: 'Lavandería', service: 'Lavandería', price: 350 },
          { id: '7', name: '👕 Polo / Camiseta Casual', category: 'Lavandería', service: 'Lavandería', price: 130 },
          { id: '8', name: '🧥 Chaqueta / Blazer Casual', category: 'Lavandería', service: 'Lavandería', price: 300 },
          
          // 2. Sastrería
          { id: '9', name: '✂️ Ruedo / Dobladillo de Pantalón', category: 'Sastrería', service: 'Sastrería', price: 250 },
          { id: '10', name: '📐 Ajuste de Cintura / Entalle', category: 'Sastrería', service: 'Sastrería', price: 350 },
          { id: '11', name: '🤐 Cambio de Zipper / Cremallera', category: 'Sastrería', service: 'Sastrería', price: 300 },
          { id: '12', name: '🧵 Ajuste de Mangas / Hombros', category: 'Sastrería', service: 'Sastrería', price: 400 },

          // 3. Autoservicio & Máquinas
          { id: '14', name: '🧺 Torre Lavadora Autoservicio (30 Lbs)', category: 'Autoservicio', service: 'Autoservicio', price: 175 },
          { id: '15', name: '🌀 Torre Secadora Autoservicio (35 min)', category: 'Autoservicio', service: 'Autoservicio', price: 150 },
          { id: '16', name: '🏭 Lavadora Industrial (75 Lbs)', category: 'Autoservicio', service: 'Autoservicio', price: 450 },
          { id: '17', name: '🔥 Secadora Industrial (80 Lbs)', category: 'Autoservicio', service: 'Autoservicio', price: 400 },
          { id: '18', name: '🪙 Ficha / Moneda Estándar', category: 'Autoservicio', service: 'Autoservicio', price: 60 },
          { id: '19', name: '🧴 Dosis Detergente Bio-Clean', category: 'Autoservicio', service: 'Autoservicio', price: 60 },
          { id: '20', name: '🌸 Dosis Suavizante Aroma Fresh', category: 'Autoservicio', service: 'Autoservicio', price: 50 },

          // 4. Hotelería
          { id: '21', name: '🏨 Lote Toallas Hotel (x Kilo)', category: 'Hotelería', service: 'HotelVolumen', price: 75 },
          { id: '22', name: '🍽️ Lencería & Mantelería (x Kilo)', category: 'Hotelería', service: 'HotelVolumen', price: 85 }
        ],
        clients: [],       // Totalmente limpio
        orders: [],        // Totalmente limpio
        inventory: [],     // Totalmente limpio
        cashMovements: []  // Totalmente limpio
      };

      localStorage.setItem('syncops_laundry_state', JSON.stringify(cleanState));
    }
  </script>
</body>
</html>
