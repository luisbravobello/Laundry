<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — SyncOps Dashboard</title>
  
  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page-exact">

  <!-- Fondo Geométrico Split Exacto -->
  <div class="login-bg-split">
    <div class="split-white-side"></div>
    <div class="split-blue-side"></div>
  </div>

  <!-- Tarjeta Central Exacta -->
  <div class="exact-login-container">
    <div class="exact-login-card">
      
      <!-- ==============================================
           LADO IZQUIERDO: BRANDING SYNCOPS (BLANCO)
           ============================================== -->
      <div class="exact-brand-side">
        <!-- Logo 3 Pétalos / Llama Azul -->
        <div class="exact-brand-logo">
          <svg width="68" height="68" viewBox="0 0 100 100" fill="none">
            <!-- Pétalo Izquierdo -->
            <path d="M40 70C35 55 32 40 40 28C44 42 45 58 40 70Z" fill="url(#petalBlueGrad)" />
            <!-- Pétalo Central -->
            <path d="M50 78C44 58 42 35 50 18C58 35 56 58 50 78Z" fill="url(#petalBlueGrad)" />
            <!-- Pétalo Derecho -->
            <path d="M60 70C65 55 68 40 60 28C56 42 55 58 60 70Z" fill="url(#petalBlueGrad)" />
            <defs>
              <linearGradient id="petalBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3B82F6" />
                <stop offset="100%" stop-color="#1D4ED8" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <h1 class="exact-brand-title">SYNCOPS DASHBOARD</h1>
        <p class="exact-brand-sub">Plataforma de Ingeniería de Alto Rendimiento</p>

        <div class="exact-brand-divider"></div>

        <p class="exact-no-account-text">¿Aún no tienes una cuenta de equipo?</p>
        
        <button type="button" class="exact-btn-create-account" onclick="toggleAuthMode()">
          <span id="btnCreateText">Crear Nueva Cuenta</span>
        </button>
      </div>

      <!-- ==============================================
           LADO DERECHO: FORMULARIO INICIAR SESIÓN (AZUL ROYAL)
           ============================================== -->
      <div class="exact-form-side">
        <h2 class="exact-form-title" id="authHeaderTitle">Iniciar Sesión</h2>
        <p class="exact-form-sub" id="authHeaderSub">Ingresa con tus credenciales o cuenta de Google</p>

        <form id="exactLoginForm" onsubmit="handleAuthSubmit(event)">
          
          <div class="exact-field-group" id="groupNameField" style="display: none;">
            <label class="exact-field-label">Full name</label>
            <input type="text" id="exactAuthName" class="exact-field-input" placeholder="Luis Bravo Bello" />
          </div>

          <div class="exact-field-group">
            <label class="exact-field-label">Your email</label>
            <input type="email" id="exactAuthEmail" class="exact-field-input" value="alex.rivera@syncops.io" required />
          </div>

          <div class="exact-field-group">
            <label class="exact-field-label">Password</label>
            <input type="password" id="exactAuthPassword" class="exact-field-input" value="••••••••••••" required />
          </div>

          <div class="exact-options-row">
            <label class="exact-checkbox-label">
              <input type="checkbox" id="exactRemember" checked />
              <span>Remember me</span>
            </label>
            <a href="#" class="exact-forgot-link" onclick="showToast('Usa el botón Google o pulsa Sign In para entrar directamente.')">Recover password</a>
          </div>

          <button type="submit" class="exact-btn-signin" id="exactBtnSubmit">
            SIGN IN
          </button>

          <div class="exact-divider-or">
            <span>O CONTINUAR CON</span>
          </div>

          <div class="exact-social-row">
            <button type="button" class="exact-btn-social" onclick="loginDirect('Luis Bravo', 'luis.bravo@syncops.io', 'Administrador')">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Google</span>
            </button>

            <button type="button" class="exact-btn-social" onclick="loginDirect('Alex Rivera', 'alex.rivera@syncops.io', 'Ingeniero Líder')">
              <svg width="18" height="18" viewBox="0 0 23 23">
                <path fill="#f35325" d="M1 1h10v10H1z"/>
                <path fill="#81bc06" d="M12 1h10v10H12z"/>
                <path fill="#05a6f0" d="M1 12h10v10H1z"/>
                <path fill="#ffba08" d="M12 12h10v10H12z"/>
              </svg>
              <span>Microsoft</span>
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
  <script>
    let isRegisterMode = false;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('groupNameField').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('authHeaderTitle').innerText = isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión';
      document.getElementById('authHeaderSub').innerText = isRegisterMode ? 'Completa tus datos para unirte al equipo' : 'Ingresa con tus credenciales o cuenta de Google';
      document.getElementById('exactBtnSubmit').innerText = isRegisterMode ? 'SIGN UP' : 'SIGN IN';
      document.getElementById('btnCreateText').innerText = isRegisterMode ? 'Ya tengo cuenta' : 'Crear Nueva Cuenta';
    }

    function loginDirect(name, email, role) {
      const user = { name, email, role, avatar: name.split(' ').map(n=>n[0]).join('').slice(0,2) };
      localStorage.setItem('syncops_user', JSON.stringify(user));
      sessionStorage.setItem('syncops_user', JSON.stringify(user));
      showToast(`Bienvenido, ${name}`, 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 400);
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('exactAuthEmail').value.trim();
      const name = isRegisterMode 
        ? (document.getElementById('exactAuthName').value.trim() || 'Luis Bravo')
        : (email.includes('alex') ? 'Alex Rivera' : 'Luis Bravo');
      loginDirect(name, email, 'Administrador');
    }
  </script>
</body>
</html>
