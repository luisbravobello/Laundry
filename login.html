<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — SyncOps Dashboard</title>
  
  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page-exact">

  <!-- Fondo Geométrico Split Exacto -->
  <div class="login-bg-split">
    <div class="split-white-side"></div>
    <div class="split-blue-side"></div>
  </div>

  <!-- Tarjeta Central -->
  <div class="exact-login-container">
    <div class="exact-login-card">
      
      <!-- ==============================================
           LADO IZQUIERDO: BRANDING SYNCOPS (BLANCO)
           ============================================== -->
      <div class="exact-brand-side">
        <!-- Logo Moderno Stylized Sync Flame -->
        <div class="exact-brand-logo">
          <svg width="72" height="72" viewBox="0 0 80 80" fill="none">
            <rect width="80" height="80" rx="20" fill="#EFF6FF" />
            <path d="M40 18C34 26 31 35 34 45C36 38 41 33 46 29C44 42 35 52 40 62C45 54 48 45 45 35C43 42 38 47 33 51C35 38 44 28 40 18Z" fill="url(#logoBlueGrad)" />
            <defs>
              <linearGradient id="logoBlueGrad" x1="20%" y1="0%" x2="80%" y2="100%">
                <stop offset="0%" stop-color="#2563EB" />
                <stop offset="100%" stop-color="#1D4ED8" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <h1 class="exact-brand-title">SYNCOPS DASHBOARD</h1>
        <p class="exact-brand-sub">Suite de Gestión para Lavanderías &amp; Sastrería</p>

        <div class="exact-brand-divider"></div>

        <p class="exact-no-account-text">¿Aún no tienes una cuenta de equipo?</p>
        
        <button type="button" class="exact-btn-create-account" onclick="toggleAuthMode()">
          <span id="btnCreateText">Crear Nueva Cuenta</span>
        </button>
      </div>

      <!-- ==============================================
           LADO DERECHO: FORMULARIO INICIAR SESIÓN (AZUL ROYAL)
           ============================================== -->
      <div class="exact-form-side">
        <h2 class="exact-form-title" id="authHeaderTitle">Iniciar Sesión</h2>
        <p class="exact-form-sub" id="authHeaderSub">Ingresa con tus credenciales de operador</p>

        <form id="exactLoginForm" onsubmit="handleAuthSubmit(event)">
          
          <div class="exact-field-group" id="groupNameField" style="display: none;">
            <label class="exact-field-label">Nombre Completo</label>
            <input type="text" id="exactAuthName" class="exact-field-input" placeholder="Luis Bravo" />
          </div>

          <div class="exact-field-group">
            <label class="exact-field-label">Correo Electrónico</label>
            <input type="email" id="exactAuthEmail" class="exact-field-input" value="luisb@gmail.com" required placeholder="tu-email@syncops.io" />
          </div>

          <div class="exact-field-group">
            <label class="exact-field-label">Contraseña</label>
            <input type="password" id="exactAuthPassword" class="exact-field-input" value="••••••••••••" required placeholder="••••••••" />
          </div>

          <div class="exact-options-row">
            <label class="exact-checkbox-label">
              <input type="checkbox" id="exactRemember" checked />
              <span>Recordar sesión</span>
            </label>
            <a href="#" class="exact-forgot-link" onclick="showToast('Ingresa con tu correo y contraseña habitual.', 'info')">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="exact-btn-signin-modern" id="exactBtnSubmit">
            <span>ENTRAR AL SISTEMA →</span>
          </button>

        </form>
      </div>

    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
  <script>
    let isRegisterMode = false;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('groupNameField').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('authHeaderTitle').innerText = isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión';
      document.getElementById('authHeaderSub').innerText = isRegisterMode ? 'Completa tus datos para unirte al equipo' : 'Ingresa con tus credenciales de operador';
      document.getElementById('exactBtnSubmit').querySelector('span').innerText = isRegisterMode ? 'REGISTRARME Y ENTRAR →' : 'ENTRAR AL SISTEMA →';
      document.getElementById('btnCreateText').innerText = isRegisterMode ? 'Ya tengo cuenta' : 'Crear Nueva Cuenta';
    }

    function loginDirect(name, email, role) {
      const user = { name, email, role, avatar: name.split(' ').map(n=>n[0]).join('').slice(0,2) };
      localStorage.setItem('syncops_user', JSON.stringify(user));
      sessionStorage.setItem('syncops_user', JSON.stringify(user));
      showToast(`Bienvenido, ${name}`, 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 350);
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('exactAuthEmail').value.trim();
      const name = isRegisterMode 
        ? (document.getElementById('exactAuthName').value.trim() || 'Luis Bravo')
        : (email.includes('alex') ? 'Alex Rivera' : 'Luis Bravo');
      loginDirect(name, email, 'Administrador');
    }
  </script>
</body>
</html>
